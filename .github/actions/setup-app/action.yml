name: Set up the app
description: Node, the Electron downloads and the app's dependencies, for a job that runs after actions/checkout.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
    # The Electron zips the tests and electron-builder download, for the version in the lockfile, in the
    # cache folders of macOS and of Windows. The folders of the other OS do not exist and are skipped.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
    - run: npm ci
      shell: bash
