name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The dependency audit depends on advisories published after a commit, so it also runs on its own.
  schedule:
    - cron: '0 21 * * 1'

permissions:
  contents: read

# A new commit on a pull request cancels the run for the one before it, whose result no longer counts.
# A push to main has a group of its own and is always checked to the end. In a group shared by main, a
# merge within minutes of another cancels the earlier commit's run, so that commit is never checked and
# its result job reports the cancellation as a failure.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The app's checks run as separate jobs at the same time. In one job they took seven and a half minutes
# on macos-latest (2026-09-25): npm test 122 s, demo:fit 205 s and the unsigned build 79 s.
jobs:
  # Whether anything outside website/ changed. A workflow left out by a paths filter never reports the
  # result job the main ruleset requires, so the pull request would wait forever; the app's jobs are
  # skipped by their if: instead.
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # The first parent is the base of a pull request's merge commit, and the previous main of a squash merge.
      - id: diff
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qv '^website/'; then
            echo app=true >> "$GITHUB_OUTPUT"
          fi

  # The app is built for macOS on Apple Silicon, which macos-latest is, and for Windows x64, which
  # windows-latest is.
  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-app
      - run: npm run typecheck
      - run: npm run i18n -- check
      - run: npm test

  # Whether the text of every card and screen still fits in each of the eleven languages and every theme,
  # in Chrome. The layout depends on the fonts of macOS, so it runs there, with the themes shared out.
  fit:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-app
      - run: npm run demo:fit -- --shard ${{ matrix.shard }}
      # demo:fit captures what did not fit into fit-shots/; the pictures are kept with the failed run.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fit-shots-${{ strategy.job-index }}
          path: fit-shots/
          if-no-files-found: ignore

  # Builds the native helpers, the bundle and an unsigned app, which also checks electron-builder.yml.
  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # git and uv are pinned in these modules, and their VERSION stamps record the modules' content, so the
      # modules are the key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            resources/git
            resources/uv
          key: bundled-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/resources/git-*.mjs', 'scripts/resources/uv.mjs') }}
      - uses: ./.github/actions/setup-app
      - run: npm run dist:mac:unsigned
      - name: Run the git and uv inside the app
        run: |
          resources="dist/mac-arm64/ASIST.app/Contents/Resources"
          "$resources/git/bin/git" --version
          "$resources/uv/uv" --version

  # The checks of test on Windows, except the dictionary's, which does not depend on the OS.
  test-windows:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-app
      - run: npm run typecheck
      - run: npm test

  # Builds the agent launcher and the microphone helper with the MSVC of the runner's Visual Studio, the bundle and the unpacked app.
  build-windows:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            resources/git
            resources/uv
          key: bundled-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/resources/git-*.mjs', 'scripts/resources/uv.mjs') }}
      - uses: ./.github/actions/setup-app
      - run: npm run dist:win:dir
      - name: Run the git, uv, agent launcher and microphone helper inside the app
        shell: bash
        run: |
          resources="dist/win-unpacked/resources"
          "$resources/git/mingw64/bin/git.exe" --version
          "$resources/uv/uv.exe" --version
          "$resources/asist-agent-launcher.exe" --version
          "$resources/asist-mic.exe" --version
      # A changed app.asar stops ASIST.exe within a second with "Integrity check failed for asar archive"
      # (measured 2026-09-27 on Electron 43.1.0), so an app still running after 20 seconds passed the check.
      - name: Start the app and stop it once it has passed the ASAR integrity check
        shell: pwsh
        env:
          ELECTRON_ENABLE_LOGGING: file
          ELECTRON_LOG_FILE: ${{ runner.temp }}\electron.log
        run: |
          $app = Start-Process -FilePath dist\win-unpacked\ASIST.exe -PassThru
          Start-Sleep -Seconds 20
          $exited = $app.HasExited
          if (-not $exited) { taskkill.exe /T /F /PID $app.Id }
          Get-Content $env:ELECTRON_LOG_FILE -TotalCount 20 -ErrorAction SilentlyContinue
          if ($exited) { throw "ASIST.exe exited within 20 seconds with code $($app.ExitCode)" }

  # The website is its own npm project, built with Astro; it needs no Mac.
  website:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm run website:build

  # The one job the main ruleset requires, so that it names neither each shard of fit nor the jobs a
  # change to the website skips. A skipped job is not a failure.
  result:
    if: always() && github.event_name != 'schedule'
    needs: [changes, test, fit, build, website, test-windows, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  audit:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm audit --omit=dev
