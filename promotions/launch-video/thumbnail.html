<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>ASIST launch video thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@500;700&display=block" rel="stylesheet" />
<style>
  :root { --paper: #fbfaf7; --ink: #1f2a44; --ink-2: #4d5670; --sky: #dfeaff; }

  .copy { position: absolute; left: 64px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .logo { display: flex; align-items: center; gap: 16px; }
  .logo img { width: 64px; height: 64px; }
  .logo span { font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 38px; letter-spacing: 0.3em; color: var(--ink); }
  h1 { margin: 36px 0 0; font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 78px; line-height: 1.3; color: var(--ink); letter-spacing: 0.01em; }
  h1 mark { background: linear-gradient(transparent 60%, var(--sky) 60%); color: inherit; }
  p { margin: 28px 0 0; font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 700; font-size: 34px; color: var(--ink-2); }
</style>
</head>
<body>
  <img class="art" src="../../website/og/art.png" alt="" />
  <div class="copy">
    <div class="logo"><img src="../../website/public/icons/asist.png" alt="" /><span>ASIST</span></div>
    <h1>話しかけるだけで、<br /><mark>予定もメールも</mark><br />片づく。</h1>
