appId: com.nyosegawa.asist
productName: ASIST
directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  # Transformers.js is bundled into the renderer at build time. Its Node-only
  # inference/image dependencies are neither imported nor needed at runtime.
  - '!node_modules/@huggingface/**'
  - '!node_modules/@img/**'
  - '!node_modules/adm-zip/**'
  - '!node_modules/onnxruntime-node/**'
  - '!node_modules/onnxruntime-web/**'
  - '!node_modules/sharp/**'
  # pdf.js is bundled into the renderer as well. Its Node canvas, the only native .node file the package
  # would otherwise carry, is never loaded, and leaving it out lets library validation stay on.
  - '!node_modules/@napi-rs/**'
  # What the bundles took in, which scripts/third-party-notices.mjs has already turned into the notices.
  - '!out/**/bundled-packages-*.json'

# The languages of the interface. Electron ships 55; macOS lists every one of them as a language of the app.
electronLanguages: [ja, en, fr, de, hi, id, it, ko, pt_BR, es_419, es]
# What the app ships on macOS and Windows alike.
extraResources:
  # The MIT license asks for its text in every copy, the app included.
  - from: LICENSE
    to: LICENSE.txt
  # Generated by scripts/third-party-notices.mjs in postbuild: the licenses of what the app bundles.
  - from: build/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  # Downloads a pinned model before its worker starts.
  - from: resources/hf_snapshot.py
    to: hf_snapshot.py
  - from: resources/aizuchi
    to: aizuchi
  - from: resources/vap_worker.py
    to: vap_worker.py
  - from: resources/vap-requirements.txt
    to: vap-requirements.txt
  - from: resources/vap-requirements-maai.txt
    to: vap-requirements-maai.txt
  - from: resources/embedding_worker.py
    to: embedding_worker.py
  - from: resources/embedding-requirements.txt
    to: embedding-requirements.txt
  # The aizuchi classifier worker shares its Python environment with the embedding worker.
  - from: resources/aizuchi_worker.py
    to: aizuchi_worker.py
  # The agent skills for memory curation, copied into the worktree of a curation job.
  - from: resources/skills
    to: skills
  # uv builds the Python environments above, fetched by scripts/prepare-resources.mjs.
  - from: resources/uv
    to: uv
  # git keeps the memory history and the worktrees of editing jobs: compiled from source on macOS and
  # MinGit on Windows, both put there by scripts/prepare-resources.mjs.
  - from: resources/git
    to: git

# scripts/prepare-resources.mjs prepares git, uv and the native helpers for the machine it runs on, so an
# app packaged for another OS or CPU would carry tools that cannot run there. This stops such a build.
beforePack: ./scripts/before-pack.mjs

mac:
  category: public.app-category.productivity
  extraResources:
    # Generated by scripts/macos/permission-texts.mjs in prebuild: the permission dialogs in each language.
    - from: build/lproj
      to: .
    - from: resources/native/macos/asist-calendar
      to: asist-calendar
    # The microphone capture helper with macOS voice processing, generated by scripts/prepare-resources.mjs.
    - from: resources/native/macos/asist-mic
      to: asist-mic
    - from: resources/mlx_asr_worker.py
      to: mlx_asr_worker.py
    - from: resources/qwen_tts_worker.py
      to: qwen_tts_worker.py
    - from: resources/mlx-audio-requirements.txt
      to: mlx-audio-requirements.txt
  icon: build/icon.png
  target:
    - target: dir
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The signing identity comes from CSC_NAME (Developer ID Application). With an ad-hoc or missing signature
  # the microphone's TCC permission does not persist.
  extendInfo:
    # What a system in a language the app has no folder for shows. The other languages are in build/lproj.
    NSCalendarsFullAccessUsageDescription: 'ASIST shows the events of the calendars you choose, and adds, changes or deletes an event only after you confirm it.'
    NSMicrophoneUsageDescription: 'ASIST uses the microphone so that you can talk with the assistant.'
    LSMinimumSystemVersion: '14.0'
  # The releases of the public repository are where electron-updater looks for a newer version, and where
  # scripts/release.mjs puts the dmg, the zip and latest-mac.yml.
  publish:
    provider: github
    owner: nyosegawa
    repo: asist

win:
  icon: build/icon.png
  # electron-builder writes app-update.yml into every NSIS installer that has a publish setting, and with none
  # of its own it takes the GitHub repository from the git remote. No command line flag keeps the file out, so
  # the setting stays null here and .github/workflows/windows-release.yml alone passes the GitHub one: a local
  # dist:win installer then never updates itself from a release of other code.
  publish: null
  # --dir replaces this target and packages for the CPU of the machine that runs electron-builder unless an
  # architecture flag is given (measured 2026-09-27 on electron-builder 26.16.1), so dist:win:dir passes --x64.
  target:
    - target: nsis
      arch:
        - x64
  extraResources:
    # Starts an agent CLI inside a job object, compiled by scripts/prepare-resources.mjs.
    - from: resources/native/windows/asist-agent-launcher.exe
      to: asist-agent-launcher.exe
    - from: resources/cuda_asr_worker.py
      to: cuda_asr_worker.py
    - from: resources/cuda-speech-requirements.txt
      to: cuda-speech-requirements.txt
    # The microphone capture helper with the communications echo canceller of Windows, compiled by
    # scripts/prepare-resources.mjs.
    - from: resources/native/windows/asist-mic.exe
      to: asist-mic.exe

# One click installs the app for the current user into %LOCALAPPDATA%\Programs\asist, without asking for
# administrator rights.
nsis:
  oneClick: true
  perMachine: false
  # Without the version in its name, releases/latest/download/ASIST-Setup-x64.exe always reaches the newest
  # installer.
  artifactName: ${productName}-Setup-${arch}.${ext}

npmRebuild: false

# Without the version in its name, releases/latest/download/ASIST-arm64.dmg always reaches the newest dmg.
dmg:
  artifactName: ${productName}-${arch}.${ext}

# With these fuses left at Electron's defaults, any local process can run its own code under ASIST's
# signature, and so with the microphone and calendar permissions the user granted to ASIST, through
# ELECTRON_RUN_AS_NODE, NODE_OPTIONS, --inspect or a replaced app folder. The Chromium switch
# --remote-debugging-port is not a fuse and keeps working.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  # The window loads its page with loadFile from file:// inside app.asar. With this fuse off, that load
  # fails with ERR_FILE_NOT_FOUND and the window stays empty (measured 2026-09-23 on Electron 43), so it
  # can be turned off only once the renderer is served over a custom scheme.
  grantFileProtocolExtraPrivileges: true
  # Flipping a fuse breaks the ad-hoc signature of the executable, and dist:mac:unsigned does not sign
  # afterwards, so macOS kills that build at launch (CODESIGNING, Invalid Page; measured 2026-09-23 on
  # Electron 43). A signed build replaces this ad-hoc signature with its own.
  resetAdHocDarwinSignature: true
